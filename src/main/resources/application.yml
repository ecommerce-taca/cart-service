spring:
  application:
    name: cart-service
  config:
    import: "optional:file:./.env[.properties]"
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false

server:
  port: ${SERVER_PORT:1204}

cart:
  max-items: 100
  item-qty-min: 1
  item-qty-max: 999
  hydrate-timeout: ${CART_HYDRATE_TIMEOUT:3s}
  idempotency-ttl: ${CART_IDEMPOTENCY_TTL:24h}
  write-retry-max: ${CART_WRITE_RETRY_MAX:3}

product:
  base-url: ${PRODUCT_BASE_URL:}
  timeout: ${PRODUCT_TIMEOUT:2s}
  cache-ttl: ${PRODUCT_CACHE_TTL:30s}
  max-concurrency: ${PRODUCT_MAX_CONCURRENCY:10}

inventory:
  base-url: ${INVENTORY_BASE_URL:}
  internal-token: ${INVENTORY_INTERNAL_TOKEN:}
  timeout: ${INVENTORY_TIMEOUT:1s}
  max-batch-size: ${INVENTORY_MAX_BATCH_SIZE:100}
  max-concurrency: ${INVENTORY_MAX_CONCURRENCY:10}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: cart-service
        env: ${APP_ENV:local}
        version: ${APP_VERSION:dev}

management:
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms,250ms,500ms,1s
  opentelemetry:
    enabled: true
    tracing:
      sampling:
        probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
      export:
        otlp:
          enabled: ${TRACING_OTLP_ENABLED:false}
      propagation:
        produce:
          - w3c
        consume:
          - w3c
